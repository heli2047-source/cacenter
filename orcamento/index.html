<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090D16">
  <title>Orçamento | Oficina CACENTER</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="stylesheet" href="styles.css?v=3">
</head>

<body>
  <header class="topbar">
    <img src="../assets/logo.png" alt="CACENTER" class="topbar-logo" width="44" height="44">
    <div class="topbar-text">
      <h1>Orçamento</h1>
      <p>Oficina Mecânica CACENTER</p>
    </div>
    <button type="button" class="btn-buscar" id="btnBuscar" aria-haspopup="dialog" aria-label="Buscar orçamentos salvos">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.5-3.5"></path>
      </svg>
      <span class="btn-buscar-texto">Buscar</span>
      <span class="badge" id="badgeSalvos" hidden>0</span>
    </button>
  </header>

  <main class="container">
    <form id="orcamentoForm" novalidate>

      <div class="faixa-edicao" id="faixaEdicao" hidden>
        <div class="faixa-texto">
          <strong>Editando orçamento salvo</strong>
          <span id="faixaDetalhe"></span>
        </div>
        <button type="button" class="btn-novo" id="btnNovo">Novo orçamento</button>
      </div>

      <fieldset class="card">
        <legend>Dados do cliente</legend>

        <div class="field">
          <label for="nome">Nome / Razão social <span class="req">obrigatório</span></label>
          <input type="text" id="nome" data-cliente="Nome/Razão social" autocomplete="name" placeholder="Nome do cliente ou empresa" required>
        </div>

        <div class="field">
          <label for="responsavel">Responsável (CNPJ)</label>
          <input type="text" id="responsavel" data-cliente="Responsável" autocomplete="off" placeholder="Responsável pela empresa">
        </div>

        <div class="field">
          <label for="documento">CPF / CNPJ</label>
          <input type="text" id="documento" data-cliente="CPF/CNPJ" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00">
        </div>

        <div class="field">
          <label for="endereco">Endereço</label>
          <input type="text" id="endereco" data-cliente="Endereço" autocomplete="street-address" placeholder="Rua, número, bairro, cidade">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" data-cliente="E-mail" inputmode="email" autocomplete="email" placeholder="cliente@email.com">
        </div>

        <div class="field">
          <label for="whatsappCliente">WhatsApp do cliente</label>
          <input type="tel" id="whatsappCliente" data-cliente="WhatsApp" inputmode="tel" autocomplete="tel" placeholder="(19) 99999-9999">
        </div>
      </fieldset>

      <fieldset class="card">
        <legend>Dados do veículo</legend>

        <div class="field">
          <label for="placas">Veículo (placas) <span class="req">obrigatório</span></label>
          <input type="text" id="placas" data-veiculo="Placas" autocomplete="off" placeholder="ABC1D23" class="upper" required>
        </div>

        <div class="field">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" data-veiculo="Modelo" autocomplete="off" placeholder="Ex.: Fiat Doblô 1.8">
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="cor">Cor</label>
            <input type="text" id="cor" data-veiculo="Cor" autocomplete="off" placeholder="Prata">
          </div>

          <div class="field">
            <label for="motor">Motor</label>
            <input type="text" id="motor" data-veiculo="Motor" autocomplete="off" placeholder="1.8 16V">
          </div>
        </div>

        <div class="field">
          <label for="km">KM</label>
          <input type="text" id="km" data-veiculo="KM" inputmode="numeric" autocomplete="off" placeholder="120000">
        </div>
      </fieldset>

      <fieldset class="card">
        <legend>Peças</legend>
        <div class="linhas" id="linhasPecas" data-bloco="pecas"></div>
        <button type="button" class="btn-add" data-add="pecas">+ Adicionar peça</button>
        <p class="bloco-total">
          <span>Total peças</span>
          <output id="totalPecas" for="linhasPecas">R$ 0,00</output>
        </p>
      </fieldset>

      <fieldset class="card">
        <legend>Serviços</legend>
        <div class="linhas" id="linhasServicos" data-bloco="servicos"></div>
        <button type="button" class="btn-add" data-add="servicos">+ Adicionar serviço</button>
        <p class="bloco-total">
          <span>Total serviços</span>
          <output id="totalServicos" for="linhasServicos">R$ 0,00</output>
        </p>
      </fieldset>

      <div class="barra-total">
        <p class="aviso" id="aviso" role="status"></p>
        <div class="barra-linha">
          <div class="barra-valor">
            <span>Valor total</span>
            <output id="totalGeral">R$ 0,00</output>
          </div>
          <button type="submit" class="btn-wa" id="btnEnviar" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.23 8.23 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24a8.2 8.2 0 0 1 5.83 2.42 8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.17c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.15.16-.29.18-.54.06-.25-.13-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.44.13-.15.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.87.85-.87 2.07 0 1.22.89 2.4 1.02 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.47-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.16-.48-.29Z"/>
            </svg>
            <span id="btnEnviarTexto">Enviar por WhatsApp</span>
          </button>
        </div>
      </div>

    </form>
  </main>

  <dialog class="dlg" id="dlgBusca" aria-labelledby="dlgTitulo">
    <div class="dlg-topo">
      <h2 id="dlgTitulo">Orçamentos salvos</h2>
      <button type="button" class="btn-fechar" id="btnFechar" aria-label="Fechar busca">&times;</button>
    </div>

    <div class="dlg-busca">
      <label for="campoBusca">Buscar por nome ou placa</label>
      <input type="search" id="campoBusca" autocomplete="off" placeholder="Ex.: João da Silva ou ABC1D23">
    </div>

    <p class="dlg-info" id="dlgInfo" role="status"></p>
    <div class="dlg-lista" id="dlgLista"></div>
  </dialog>

  <dialog class="dlg" id="dlgEnvio" aria-labelledby="envioTitulo">
    <div class="dlg-topo">
      <h2 id="envioTitulo">Enviar orçamento</h2>
      <button type="button" class="btn-fechar" id="btnFecharEnvio" aria-label="Fechar envio">&times;</button>
    </div>

    <p class="dlg-info" id="envioInfo" role="status"></p>
    <div class="dlg-lista" id="envioLista"></div>
  </dialog>

  <template id="tplDestino">
    <button type="button" class="destino" data-destino>
      <span class="destino-info">
        <span class="destino-nome"></span>
        <span class="destino-tel"></span>
      </span>
      <span class="destino-estado"></span>
    </button>
  </template>

  <template id="tplLinha">
    <div class="linha">
      <span class="linha-num"></span>
      <button type="button" class="btn-remove" data-remove aria-label="Remover este item">&times;</button>
      <label class="f-desc">
        <span>Item</span>
        <input type="text" data-campo="desc" autocomplete="off" placeholder="Descrição">
      </label>
      <label class="f-qtd">
        <span>Qtd</span>
        <input type="text" data-campo="qtd" inputmode="decimal" autocomplete="off" value="1">
      </label>
      <label class="f-valor">
        <span>Valor unit.</span>
        <input type="text" data-campo="valor" inputmode="decimal" autocomplete="off" placeholder="0,00">
      </label>
      <span class="f-sub">
        <span>Subtotal</span>
        <output data-campo="subtotal">R$ 0,00</output>
      </span>
    </div>
  </template>

  <template id="tplResultado">
    <article class="resultado">
      <button type="button" class="resultado-topo" data-alternar>
        <span class="resultado-nome"></span>
        <span class="resultado-placa"></span>
        <span class="resultado-data"></span>
        <span class="resultado-total"></span>
      </button>
      <div class="resultado-corpo" hidden>
        <pre class="resultado-texto"></pre>
        <div class="resultado-acoes">
          <button type="button" class="btn-acao btn-editar" data-editar>Editar</button>
          <button type="button" class="btn-acao btn-reenviar" data-reenviar>Reenviar</button>
          <button type="button" class="btn-acao btn-excluir" data-excluir>Excluir</button>
        </div>
      </div>
    </article>
  </template>

  <script src="app.js?v=3"></script>
</body>

</html>
